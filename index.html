const KEY='rodme-garage-v2', LEGACY_KEY='rodme-garage-v1';const original=['Bieleta derecha de barra estabilizadora','Engrase general','Frenos','Suspensión y dirección','Aceite del motor y filtro','Sistema de refrigeración','Transmisión, diferenciales y transferencia','Llantas actuales','Limpiaparabrisas del pasajero','Sistema eléctrico','Motor y Check Engine','Radio','Ventana del copiloto','Cierre de puerta del pasajero','Revisión profunda pre-DEKRA','Reparaciones finales','DEKRA'];
function newVehicle(name,brand='',model='',year='',plate='',isJeep=false){return {id:'veh-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name,brand,model,year,plate,entries:[],tasks:isJeep?original.map((name,i)=>({id:i+1,name,status:'Pendiente',notes:''})):[],docs:[],odometer:''}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};
if(!state||!Array.isArray(state.vehicles)){let old={};try{old=JSON.parse(localStorage.getItem(LEGACY_KEY))||{}}catch{};let jeep=newVehicle('Mi Jeep Rubicon','Jeep','Wrangler Rubicon','2007','',true);jeep.entries=Array.isArray(old.entries)?old.entries:[];jeep.tasks=Array.isArray(old.tasks)?old.tasks:jeep.tasks;jeep.docs=Array.isArray(old.docs)?old.docs:[];jeep.odometer=old.odometer||'';state={vehicles:[jeep],selectedVehicleId:jeep.id}}
function active(){return state.vehicles.find(v=>v.id===state.selectedVehicleId)||state.vehicles[0]}
let tab='Inicio';const pages=['Inicio','Vehículos','Gastos','Gasolina','Mantenimiento','Pendientes','Documentos','Talleres','Reportes','Respaldos','Configuración'];
function save(){cloudSave()}function money(n){return new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC',maximumFractionDigits:0}).format(n||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function h(tag,props={}){return Object.entries(props).map(([k,v])=>`${k}="${esc(v)}"`).join(' ')}function options(names,selected){return names.map(x=>`<option ${selected===x?'selected':''}>${esc(x)}</option>`).join('')}function render(){document.getElementById('vehicleSelect').innerHTML=state.vehicles.map(v=>`<option value="${esc(v.id)}" ${active().id===v.id?'selected':''}>${esc(v.name)}</option>`).join('');document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${p===tab?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let s='';const entries=active().entries;const total=entries.reduce((a,e)=>a+Number(e.amount||0),0);const fuel=entries.filter(e=>e.kind==='Gasolina');const expenses=entries.filter(e=>e.kind!=='Gasolina');const done=active().tasks.filter(x=>x.status==='Terminado').length;
if(tab==='Inicio'){const month=today().slice(0,7),monthly=entries.filter(x=>String(x.date||'').startsWith(month));const monthTotal=monthly.reduce((a,e)=>a+Number(e.amount||0),0);const ds=(active().docs||[]).filter(d=>d.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));const recent=[...entries].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,4);const overdue=(active().docs||[]).filter(d=>d.date&&d.date<=new Date(Date.now()+30*86400000).toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date));let pending=active().tasks.filter(t=>t.status!=='Terminado');s=`<div class="hero"><div><small>MI GARAJE · ${state.vehicles.length} vehículo${state.vehicles.length!==1?'s':''}</small><h2>TODO SOBRE<br>TU VEHÍCULO.<br><span>${esc(active().name)}</span></h2><p>${esc([active().brand,active().model,active().year].filter(Boolean).join(' · '))}${active().plate?' · '+esc(active().plate):''}</p><button onclick="go('Vehículos')">VER MIS VEHÍCULOS &nbsp;→</button></div><div class="avatar">🚘</div></div><div class="grid"><div class="card"><div class="stat-icon">💳</div><div class="statslabel">Gastos del mes</div><div class="metric">${money(monthTotal)}</div><div class="tiny">${monthly.length} movimientos registrados</div></div><div class="card"><div class="stat-icon">⛽</div><div class="statslabel">Gasolina acumulada</div><div class="metric">${money(fuel.reduce((a,e)=>a+Number(e.amount),0))}</div><div class="tiny">${fuel.length} cargas registradas</div></div><div class="card"><div class="stat-icon">🛠️</div><div class="statslabel">Trabajos pendientes</div><div class="metric">${pending.length}</div><div class="tiny">${done} de ${active().tasks.length} completados</div></div></div>${active().monthlyBudget?'<div class="card"><strong>Presupuesto mensual: '+money(active().monthlyBudget)+'</strong><p class="muted">'+(monthTotal>Number(active().monthlyBudget)?'Presupuesto excedido por '+money(monthTotal-Number(active().monthlyBudget)):'Disponible: '+money(Number(active().monthlyBudget)-monthTotal))+'</p></div>':''}${overdue.length?`<div class="card"><h3>Vencimientos próximos</h3>${overdue.map(d=>`<p><strong>${esc(d.name)}</strong> · ${esc(d.date)} ${d.date<today()?'· Vencido':'· Próximo'}</p>`).join('')}<button class="secondary" onclick="go('Documentos')">Ver documentos</button></div>`:''}<div class="section-header"><h3>Accesos rápidos</h3></div><div class="quicklinks"><button class="quick" onclick="go('Gasolina')"><span class="ico">⛽</span> Cargar gasolina</button><button class="quick" onclick="go('Gastos')"><span class="ico">💰</span> Agregar gasto</button><button class="quick" onclick="go('Mantenimiento')"><span class="ico">🔧</span> Servicios</button><button class="quick" onclick="go('Documentos')"><span class="ico">📅</span> Vencimientos</button></div><div class="section-header"><h3>Resumen del vehículo</h3><button class="linklike" onclick="go('Pendientes')">Ver pendientes →</button></div><div class="grid"><div class="card"><div class="statslabel">Odómetro actual</div><div class="metric">${active().odometer?Number(active().odometer).toLocaleString('es-CR')+' km':'Sin dato'}</div><form onsubmit="setOdometer(event)" style="display:flex;gap:7px"><input aria-label="Nuevo kilometraje" id="odometer" type="number" min="0" step="1" style="min-width:0" value="${esc(active().odometer)}" placeholder="Kilometraje"><button>✓</button></form></div><div class="card"><div class="statslabel">Progreso de reparaciones</div><div class="metric">${active().tasks.length?Math.round(done/active().tasks.length*100):0}%</div><div class="progress"><span style="width:${active().tasks.length?done/active().tasks.length*100:0}%"></span></div><div class="tiny">${done} trabajos terminados</div></div><div class="card"><div class="statslabel">Inversión registrada</div><div class="metric">${money(total)}</div><div class="tiny">Desde el primer registro</div></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))"><div class="card"><div class="row"><h3>🔧 Próximos trabajos</h3><button class="linklike" onclick="go('Pendientes')">Ver todos</button></div>${pending.length?pending.slice(0,4).map(t=>`<div class="record"><span>${esc(t.name)}</span><span class="chip">${esc(t.status)}</span></div>`).join(''):'<p class="muted">No hay trabajos pendientes.</p>'}</div><div class="card"><div class="row"><h3>📅 Próximos vencimientos</h3><button class="linklike" onclick="go('Documentos')">Administrar</button></div>${ds.length?ds.slice(0,4).map(d=>`<div class="record"><strong>${esc(d.name)}</strong><span class="chip">${esc(d.date)}</span></div>`).join(''):'<p class="muted">Agregá marchamo, DEKRA y seguros para ver las próximas fechas.</p>'}</div></div><div class="card"><div class="row"><h3>🧾 Actividad reciente</h3><button class="linklike" onclick="go('Gastos')">Ver gastos →</button></div>${recent.length?recent.map(e=>`<div class="record"><div><strong>${esc(e.description||e.kind)}</strong><div class="tiny">${esc(e.date)} · ${esc(e.kind)}</div></div><strong>${money(e.amount)}</strong></div>`).join(''):'<p class="muted">Todavía no hay movimientos. Registrá tu primer gasto o carga de gasolina.</p>'}</div><div class="notice"><strong>☁️ Estado del almacenamiento: <span id="homeCloudStatus">${cloudReady?(cloudDirty?"Cambios pendientes de sincronizar":"Firebase conectado"):"Comprobando conexión"}</span></strong><p class="muted" style="margin:5px 0">Tus registros se guardan en Firestore al iniciar sesión. Verificá que aparezca «Sincronizado con Firebase» después de cada cambio. También podés comprobar la conexión en Configuración y descargar respaldos desde Respaldos.</p></div>`}
if(tab==='Vehículos'){s=`<h2>Mis vehículos</h2><div class="grid">${state.vehicles.map(v=>`<div class="card"><h3>${esc(v.name)}</h3><p class="muted">${esc([v.brand,v.model,v.year].filter(Boolean).join(' · '))}</p><p class="muted">Placa: ${esc(v.plate||'Sin registrar')}</p><div class="metric">${money(v.entries.reduce((a,e)=>a+Number(e.amount||0),0))}</div><div class="row"><button onclick="selectVehicle('${esc(v.id)}');go('Inicio')">Ver registros</button>${state.vehicles.length>1?`<button class="danger" onclick="deleteVehicle('${esc(v.id)}')">Eliminar</button>`:''}</div></div>`).join('')}</div><div class="card"><h3>Agregar otro vehículo</h3><form onsubmit="addVehicle(event)"><div class="cols"><div class="field"><label>Nombre para identificarlo</label><input name="name" required placeholder="Ej. Carro familiar"></div><div class="field"><label>Marca</label><input name="brand" placeholder="Toyota"></div><div class="field"><label>Modelo</label><input name="model" placeholder="RAV4"></div><div class="field"><label>Año</label><input name="year" type="number" min="1900" max="2100"></div><div class="field"><label>Placa (opcional)</label><input name="plate"></div></div><button>Agregar vehículo</button></form></div><p class="muted">Cada carro guarda por separado sus gastos, gasolina, kilometraje, pendientes y documentos.</p>`}
if(tab==='Gastos'){s=`<h2>Gastos y reparaciones</h2><div class="card"><h3>Registrar gasto</h3><form onsubmit="addExpense(event)"><div class="cols"><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Categoría</label><select name="kind">${options(['Reparación','Mantenimiento','Repuesto','DEKRA','Marchamo','Seguro','Peajes','Parqueo','Lavado','Otro'])}</select></div><div class="field"><label>Descripción</label><input name="description" required placeholder="Ej. Cambio de pastillas"></div><div class="field"><label>Monto (₡)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Taller / proveedor (opcional)</label><input name="vendor"></div><div class="field"><label>Kilometraje (opcional)</label><input name="km" type="number" min="0"></div></div><button>Guardar gasto</button></form></div>${table(expenses)}`}
if(tab==='Gasolina'){const fills=fuel.filter(x=>x.full&&Number(x.liters)>0&&Number(x.km)>0).sort((a,b)=>a.km-b.km);let cycles=[];for(let i=1;i<fills.length;i++){let previous=fills[i-1],now=fills[i];let between=fuel.filter(x=>Number(x.km)>previous.km&&Number(x.km)<=now.km);let litres=between.reduce((a,x)=>a+Number(x.liters||0),0);if(now.km>previous.km&&litres>0)cycles.push((now.km-previous.km)/litres)}let avg=cycles.length?(cycles.reduce((a,b)=>a+b,0)/cycles.length).toFixed(2):'—';s=`<h2>Gasolina y consumo</h2><div class="grid"><div class="card"><div class="muted">Total gasolina</div><div class="metric">${money(fuel.reduce((a,e)=>a+Number(e.amount),0))}</div></div><div class="card"><div class="muted">Litros registrados</div><div class="metric">${fuel.reduce((a,e)=>a+Number(e.liters||0),0).toFixed(1)} L</div></div><div class="card"><div class="muted">Rendimiento estimado</div><div class="metric">${avg} km/L</div></div></div><div class="card"><h3>Nuevo llenado</h3><form onsubmit="addFuel(event)"><div class="cols"><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Estación de servicio</label><input name="vendor" placeholder="Gasolinera"></div><div class="field"><label>Litros</label><input name="liters" type="number" min="0.01" step="0.001" required></div><div class="field"><label>Precio total (₡)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Kilometraje al cargar</label><input name="km" type="number" min="0" step="1" required></div><div class="field"><label>Tipo</label><select name="full"><option value="yes">Tanque lleno</option><option value="no">Carga parcial</option></select></div></div><button>Guardar carga</button></form><p class="muted">El rendimiento se calcula entre llenados completos usando los litros registrados desde el llenado anterior. Registrá también las cargas parciales para obtener valores correctos.</p></div>${table(fuel)}`}
if(tab==='Talleres'){const shops=active().shops||[];s=`<h2>Talleres y proveedores</h2><div class="card"><h3>Nuevo contacto</h3><form onsubmit="addShop(event)"><div class="cols"><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Teléfono</label><input name="phone"></div><div class="field"><label>Ubicación</label><input name="location"></div><div class="field"><label>Especialidad</label><input name="specialty"></div></div><button>Guardar contacto</button></form></div>${shops.map((x,i)=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.phone||'')} · ${esc(x.location||'')}</p><p>${esc(x.specialty||'')}</p><button class="danger" onclick="removeShop(${i})">Eliminar</button></div>`).join('')}`}
if(tab==='Mantenimiento'){s=`<h2>Historial de mantenimiento</h2><div class="card"><p>Los servicios y reparaciones de este vehículo se registran en Gastos. Aquí podés ver únicamente esas categorías.</p><button onclick="go('Gastos')">Registrar mantenimiento</button></div>${table(expenses.filter(x=>['Reparación','Mantenimiento','Repuesto'].includes(x.kind)))}`}
if(tab==='Pendientes'){s=`<h2>Pendientes del mecánico</h2><p class="muted">Trabajos de este vehículo. Cambiá el estado y agregá observaciones o diagnósticos.</p><div class="card"><form onsubmit="addTask(event)" class="row"><input name="name" required placeholder="Agregar nuevo pendiente" style="flex:1;min-width:180px"><button>Añadir</button></form>${active().tasks.map((t,i)=>`<div style="padding:13px 0;border-bottom:1px solid #edf0f0"><div class="row"><strong class="${t.status==='Terminado'?'done':''}">${i+1}. ${esc(t.name)}</strong><select style="width:auto" onchange="updateTask(${i},'status',this.value)">${options(['Pendiente','En diagnóstico','En reparación','Terminado'],t.status)}</select></div><div class="field"><label>Observaciones</label><textarea rows="2" onchange="updateTask(${i},'notes',this.value)" placeholder="Diagnóstico, repuestos, precio estimado...">${esc(t.notes)}</textarea></div>${t.status!=='Terminado'?`<button class="secondary" onclick="finishTask(${i})">Terminar y registrar reparación</button>`:`<small>Completado: ${esc(t.completedAt||'')} · ${money(t.cost||0)}</small>`}</div>`).join('')}</div>`}
if(tab==='Documentos'){let ds=active().docs||[];s=`<h2>Documentos y vencimientos</h2><div class="card"><h3>Agregar fecha importante</h3><form onsubmit="addDoc(event)"><div class="cols"><div class="field"><label>Documento / obligación</label><select name="name">${options(['DEKRA','Marchamo','Seguro','Licencia','Otro'])}</select></div><div class="field"><label>Vencimiento</label><input type="date" name="date" required></div></div><button>Guardar recordatorio</button></form></div><div class="card"><h3>Fechas registradas</h3>${ds.length?ds.map((d,i)=>`<div class="row" style="padding:10px;border-bottom:1px solid #eee"><div><strong>${esc(d.name)}</strong> · ${esc(d.date)} ${d.date<today()?'<span class="pill">Vencido</span>':''}</div><button class="danger" onclick="deleteDoc(${i})">Eliminar</button></div>`).join(''):'<p class="muted">Todavía no hay fechas registradas.</p>'}</div><p class="alert">Estas fechas se muestran dentro de la app. Esta versión no envía notificaciones automáticas fuera del navegador.</p>`}
if(tab==='Reportes'){s=`<h2>Reportes y estadísticas</h2><p class="muted">Analizá tus gastos por categoría y descargá los movimientos del vehículo seleccionado.</p><div class="card"><div class="cols"><div class="field"><label>Mes (dejá vacío para ver todo)</label><input type="month" id="reportMonth" onchange="renderReport()"></div><div class="field"><label>Exportar</label><button onclick="exportReport()">Descargar reporte CSV</button><button class="secondary" onclick="window.print()">Imprimir / Guardar como PDF</button></div></div></div><div id="reportDetails"></div>`;setTimeout(()=>{if(document.getElementById('reportMonth'))renderReport()},0)}
if(tab==='Configuración'){const v=active();s=`<h2>Configuración</h2><p class="muted">Administrá tu cuenta y personalizá la información del vehículo seleccionado.</p>
<div class="card"><h3>Mi cuenta</h3><p><strong>Correo:</strong> ${esc(cloudUser?.email||'Sin sesión iniciada')}</p><p class="muted">Tus vehículos y registros se guardan en tu cuenta de Firebase. Usá la misma cuenta en tus dispositivos.</p><div class="row"><button class="secondary" onclick="cloudLogout()">Cerrar sesión</button><span class="pill" id="settingsConnection">${cloudReady?'Conectado con Firebase':'Sin conexión'}</span></div></div>
<div class="card"><h3>Editar datos de este vehículo</h3><form onsubmit="updateVehicleInfo(event)"><div class="cols"><div class="field"><label>Nombre del vehículo</label><input name="name" required maxlength="90" value="${esc(v.name)}"></div><div class="field"><label>Marca</label><input name="brand" maxlength="60" value="${esc(v.brand)}"></div><div class="field"><label>Modelo</label><input name="model" maxlength="70" value="${esc(v.model)}"></div><div class="field"><label>Año</label><input name="year" type="number" min="1900" max="2100" value="${esc(v.year)}"></div><div class="field"><label>Placa</label><input name="plate" maxlength="20" value="${esc(v.plate)}"></div><div class="field"><label>Kilometraje actual</label><input name="odometer" type="number" min="0" step="1" value="${esc(v.odometer)}"></div></div><button type="submit">Guardar cambios</button></form></div>
<div class="card"><h3>Información adicional</h3><form onsubmit="updateExtraVehicle(event)"><div class="cols"><div class="field"><label>VIN / número de chasis</label><input name="vin" maxlength="32" value="${esc(v.vin||'')}"></div><div class="field"><label>Motorización</label><input name="engine" maxlength="80" value="${esc(v.engine||'')}"></div><div class="field"><label>Transmisión</label><input name="transmission" maxlength="80" value="${esc(v.transmission||'')}"></div><div class="field"><label>Medida de llantas</label><input name="tires" maxlength="80" value="${esc(v.tires||'')}"></div><div class="field"><label>Enlace de foto del vehículo (HTTPS)</label><input type="url" name="photoURL" value="${esc(v.photoURL||'')}"></div><div class="field"><label>Presupuesto mensual en colones</label><input type="number" min="0" name="monthlyBudget" value="${esc(v.monthlyBudget||'')}"></div></div><button>Guardar detalles</button></form></div><div class="card"><h3>Datos y respaldos</h3><p class="muted">Conservá una copia de seguridad adicional de tus registros. Incluye todos los vehículos.</p><div class="row"><button onclick="backup()">Descargar respaldo JSON</button><button class="secondary" onclick="csv()">Exportar gastos CSV</button><button class="secondary" onclick="go('Respaldos')">Importar respaldo</button></div></div>
<div class="card"><h3>Estado de guardado en línea</h3><p class="muted">Comprobá si Firebase permite acceder a tu información. Si aparece un error de permisos, revisá las reglas de Firestore.</p><div class="row"><button onclick="checkFirebaseConnection()">Comprobar Firebase</button><button class="secondary" onclick="retryCloudSave()">Reintentar guardado</button></div><p id="cloudTestResult" role="status" class="muted"></p></div><div class="card"><h3>Preferencias</h3><p><strong>Moneda:</strong> colones costarricenses (CRC) · <strong>Distancia:</strong> kilómetros (km) · <strong>Combustible:</strong> litros (L)</p><p class="muted">Los vencimientos se consultan en Documentos. Las notificaciones automáticas externas aún no están disponibles.</p><button class="secondary" onclick="go('Documentos')">Ver vencimientos</button></div>`}
if(tab==='Respaldos'){s=`<h2>Copias de seguridad y privacidad</h2><div class="card"><h3>Respaldar tus datos</h3><p class="muted">Exportá todos los vehículos, registros, pendientes y documentos a un archivo JSON. Guardalo en un lugar seguro.</p><button onclick="backup()">Descargar copia de seguridad</button></div><div class="card"><h3>Restaurar copia</h3><p class="muted">Esto reemplaza los datos que estén guardados actualmente en este navegador.</p><input type="file" id="import" accept="application/json,.json"><p><button class="secondary" onclick="restore()">Importar archivo</button></p></div><div class="card"><h3>Exportación para Excel</h3><p><button class="secondary" onclick="csv()">Descargar movimientos CSV</button></p></div><div class="card"><h3>Importante</h3><p class="muted">Los registros de la cuenta iniciada se guardan en Firestore. Descargá copias de seguridad periódicas. Si aparece un error de sincronización, no asumás que un cambio quedó respaldado.</p></div>`}
document.getElementById('root').innerHTML=s}
function updateExtraVehicle(ev){const o=formObj(ev),v=active();for(const k of ['vin','engine','transmission','tires','photoURL','monthlyBudget'])v[k]=o[k]||'';if(v.photoURL&&!/^https:\/\//i.test(v.photoURL))return alert('La fotografía debe usar una dirección HTTPS');save();render()}
function updateVehicleInfo(ev){const o=formObj(ev);const v=active();v.name=String(o.name||'').trim();if(!v.name)return alert('Indicá un nombre para el vehículo.');v.brand=String(o.brand||'').trim();v.model=String(o.model||'').trim();v.year=String(o.year||'');v.plate=String(o.plate||'').trim();v.odometer=String(o.odometer||'');save();render();alert('Datos del vehículo actualizados.')}
function selectVehicle(id){if(!state.vehicles.some(v=>v.id===id))return;state.selectedVehicleId=id;save();render()}function addVehicle(ev){let o=formObj(ev);let v=newVehicle(o.name.trim(),o.brand,o.model,o.year,o.plate);state.vehicles.push(v);state.selectedVehicleId=v.id;save();go('Inicio')}function deleteVehicle(id){if(state.vehicles.length<2)return;if(!confirm('¿Eliminar este vehículo y TODOS sus registros? Esta acción no se puede deshacer. Descargá antes un respaldo.'))return;state.vehicles=state.vehicles.filter(v=>v.id!==id);state.selectedVehicleId=state.vehicles[0].id;save();render()}function go(p){tab=p;render();window.scrollTo(0,0)}function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function formObj(ev){ev.preventDefault();return Object.fromEntries(new FormData(ev.target).entries())}function addExpense(ev){let o=formObj(ev);active().entries.unshift({...o,amount:Number(o.amount),id:Date.now()+Math.random()});save();render()}function addFuel(ev){let o=formObj(ev);active().entries.unshift({...o,kind:'Gasolina',description:'Carga de gasolina',amount:Number(o.amount),km:Number(o.km),liters:Number(o.liters),full:o.full==='yes',id:Date.now()+Math.random()});save();render()}function setOdometer(ev){ev.preventDefault();active().odometer=document.getElementById('odometer').value;save();render()}function addShop(ev){const o=formObj(ev);active().shops=active().shops||[];active().shops.push(o);save();render()}function removeShop(i){if(!confirm('¿Eliminar contacto?'))return;active().shops.splice(i,1);save();render()}
function finishTask(i){const t=active().tasks[i];if(!t||t.status==='Terminado')return;const a=prompt('Costo total de reparación en colones (0 si fue sin costo):','0');if(a===null)return;const amount=Number(a);if(!Number.isFinite(amount)||amount<0)return alert('Monto inválido');const vendor=prompt('Taller o mecánico (opcional):','');if(vendor===null)return;t.status='Terminado';t.completedAt=today();t.cost=amount;if(amount>0){active().entries.unshift({id:Date.now()+Math.random(),date:today(),kind:'Reparación',description:t.name,amount,vendor,taskId:t.id})}save();render()}
function addTask(ev){let o=formObj(ev);active().tasks.push({id:Date.now(),name:o.name,status:'Pendiente',notes:''});save();render()}function updateTask(i,field,value){active().tasks[i][field]=value;save();if(field==='status')render()}function addDoc(ev){let o=formObj(ev);active().docs=active().docs||[];active().docs.push(o);save();render()}function deleteDoc(i){if(!confirm('¿Eliminar este recordatorio?'))return;active().docs.splice(i,1);save();render()}function removeEntry(id){if(!confirm('¿Eliminar este registro?'))return;active().entries=active().entries.filter(x=>x.id!==id);save();render()}function editEntry(id){
const e=active().entries.find(x=>Number(x.id)===Number(id));if(!e)return;
const d=prompt('Descripción:',e.description||'');if(d===null)return;
const a=prompt('Monto en colones:',String(e.amount||0));if(a===null)return;
const amount=Number(a);if(!Number.isFinite(amount)||amount<0)return alert('Monto inválido');
const date=prompt('Fecha (AAAA-MM-DD):',e.date||today());if(date===null)return;
if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Fecha inválida');
if(e.kind==='Gasolina'){const liters=prompt('Litros cargados:',String(e.liters||''));if(liters===null)return;const km=prompt('Kilometraje:',String(e.km||''));if(km===null)return;if(!(Number(liters)>0)||!(Number(km)>=0))return alert('Litros o kilometraje inválidos');e.liters=Number(liters);e.km=Number(km)}
e.description=d.trim();e.amount=amount;e.date=date;e.updatedAt=new Date().toISOString();save();render();
}
function reportPeriod(month){
const v=active(),entries=v.entries.filter(x=>!month||String(x.date||'').startsWith(month));
const group={};for(const e of entries)group[e.kind||'Otro']=(group[e.kind||'Otro']||0)+Number(e.amount||0);
const total=entries.reduce((n,e)=>n+Number(e.amount||0),0);
return {entries,group,total};
}
function exportReport(){const month=document.getElementById('reportMonth')?.value||'';const v=active(),r=reportPeriod(month);
const rows=[['Fecha','Categoría','Descripción','Monto CRC','Proveedor','Kilometraje'],...r.entries.map(e=>[e.date,e.kind,e.description,e.amount,e.vendor||'',e.km||''])];
const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
download('reporte-'+v.name.replace(/[^a-z0-9]+/gi,'-')+'-'+(month||'total')+'.csv','\uFEFF'+rows.map(row=>row.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');
}
function renderReport(){const month=document.getElementById('reportMonth').value,r=reportPeriod(month);
document.getElementById('reportDetails').innerHTML='<div class="card"><h3>Total del período: '+money(r.total)+'</h3>'+Object.entries(r.group).sort((a,b)=>b[1]-a[1]).map(([name,amt])=>'<div class="reportBar"><span>'+esc(name)+'</span><div><i style="width:'+((amt/(r.total||1))*100)+'%"></i></div><strong>'+money(amt)+'</strong></div>').join('')+(r.entries.length?'':'<p class="muted">No hay movimientos en este período.</p>')+'</div>';
}
function table(items){return `<div class="card"><div class="row"><h3>Registros (${items.length})</h3><span class="pill">Total: ${money(items.reduce((s,x)=>s+Number(x.amount||0),0))}</span></div><div class="scroll"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Monto</th><th></th></tr></thead><tbody>${items.length?items.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${esc(x.description)}${x.liters?` · ${esc(x.liters)} L`:''}${x.km?` · ${esc(x.km)} km`:''}${x.vendor?`<br><span class="muted">${esc(x.vendor)}</span>`:''}</td><td>${money(x.amount)}</td><td><div class="row"><button class="secondary" onclick="editEntry(${Number(x.id)})">Editar</button><button class="danger" onclick="removeEntry(${Number(x.id)})">Eliminar</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="muted">No hay registros todavía.</td></tr>'}</tbody></table></div></div>`}function download(name,data,type){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function backup(){download('rodme-garage-respaldo-'+today()+'.json',JSON.stringify(state,null,2),'application/json')}function csv(){let fields=['date','kind','description','amount','vendor','km','liters','full'];let rows=[['Vehículo',...fields].join(';'),...state.vehicles.flatMap(v=>v.entries.map(o=>[v.name,...fields.map(f=>'"'+String(o[f]??'').replace(/"/g,'""')+'"')].join(';')))] ;download('rodme-garage-movimientos-'+today()+'.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8')}async function restore(){let f=document.getElementById('import').files[0];if(!f)return alert('Seleccioná un archivo JSON.');try{let next=JSON.parse(await f.text());if(!Array.isArray(next.vehicles)||!next.vehicles.length||next.vehicles.some(v=>!Array.isArray(v.entries)||!Array.isArray(v.tasks)||!Array.isArray(v.docs)))throw Error('Formato inválido');if(!confirm('Se reemplazarán todos los datos actuales. ¿Continuar?'))return;state=next;state.selectedVehicleId=active().id;save();render();alert('Datos restaurados.')}catch(e){alert('No se pudo importar el archivo: '+e.message)}}

const firebaseConfig={apiKey:"AIzaSyA53OoXZqpn3IqRaL98HcPs3HgZLRyPKMU",authDomain:"rodme-garage.firebaseapp.com",projectId:"rodme-garage",storageBucket:"rodme-garage.firebasestorage.app",messagingSenderId:"431305257232",appId:"1:431305257232:web:747b3052c3f1103aa73595"};
let cloudDb=null,cloudUser=null,cloudReady=false,cloudTimer=null,cloudSnapshot=null,cloudDirty=false,cloudWriting=false,cloudQueued=false,cloudVersion=0,cloudRevision=0,cloudConflict=false;
const cloudGate=document.getElementById('cloudGate'),cloudLogin=document.getElementById('cloudLogin'),cloudImport=document.getElementById('cloudImport'),cloudSubtitle=document.getElementById('cloudSubtitle');
const cloudMessage=document.getElementById('cloudMessage');
function cloudError(e){return ({'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/email-already-in-use':'El correo ya está registrado.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/unauthorized-domain':'Agregá el dominio de GitHub Pages a Authentication → Settings → Authorized domains.','auth/operation-not-allowed':'Activá el proveedor correspondiente en Firebase Authentication.','auth/account-exists-with-different-credential':'Ya existe una cuenta con ese correo mediante otro método. Iniciá sesión con el método anterior antes de vincular Google.','auth/popup-closed-by-user':'Se cerró la ventana de Google sin iniciar sesión.','permission-denied':'Firestore denegó el acceso. Revisá las reglas de seguridad.','unavailable':'No hay conexión disponible. Volvé a intentarlo.'})[e.code]||('No se pudo completar: '+(e.message||e.code||'Error desconocido'))}
function defaultGarage(){const v=newVehicle('Mi Jeep Rubicon','Jeep','Wrangler Rubicon','2007','',true);return {vehicles:[v],selectedVehicleId:v.id}}
function cloudDoc(){return cloudDb.collection('users').doc(cloudUser.uid).collection('garage').doc('main')}
function cloudWatch(){
  if(cloudSnapshot)cloudSnapshot();
  cloudSnapshot=cloudDoc().onSnapshot({includeMetadataChanges:true},snap=>{
    if(!cloudReady||!snap.exists||!snap.data().state)return;
    if(snap.metadata.hasPendingWrites)return;
    if(cloudDirty||cloudWriting||cloudConflict)return;
    cloudRevision=Number(snap.data().revision||0);const incoming=snap.data().state;
    if(JSON.stringify(incoming)!==JSON.stringify(state)){
      state=incoming;
      if(!state.vehicles.some(v=>v.id===state.selectedVehicleId))state.selectedVehicleId=state.vehicles[0].id;
      render();
    }
    document.getElementById('cloudStatus').textContent='Actualizado en todos tus dispositivos';
    document.getElementById('headerSync').textContent='Sincronizado con Firebase';
  },e=>{
    document.getElementById('cloudStatus').textContent='Error al escuchar cambios';
    document.getElementById('headerSync').textContent='Revisá la conexión';
    console.error('Firestore listener:',e)
  });
}
async function cloudWrite(){
 if(!cloudReady||!cloudUser||cloudConflict)return;
 if(cloudWriting){cloudQueued=true;return}
 cloudWriting=true;const version=cloudVersion;const snapshot=JSON.parse(JSON.stringify(state));
 try{
  const expected=cloudRevision;
  const newRevision=await cloudDb.runTransaction(async tx=>{
   const doc=await tx.get(cloudDoc());
   const actual=Number((doc.exists&&doc.data().revision)||0);
   if(actual!==expected)throw new Error('conflict:los datos cambiaron en otro dispositivo');
   tx.set(cloudDoc(),{state:snapshot,revision:actual+1,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   return actual+1;
  });
  cloudRevision=newRevision;
  if(version===cloudVersion)cloudDirty=false;
  if(!cloudDirty&&!cloudQueued){document.getElementById('cloudStatus').textContent='Guardado en línea';document.getElementById('headerSync').textContent='Sincronizado con Firebase'}
 }catch(e){
  cloudDirty=true;
  if(String(e.message||'').includes('conflict:')){
   cloudConflict=true;cloudQueued=false;
   document.getElementById('cloudStatus').textContent='Conflicto entre dispositivos · Respaldá antes de continuar';
   document.getElementById('headerSync').textContent='Cambios no guardados · Conflicto';
   alert('Otro dispositivo modificó el garaje. No sobrescribí sus cambios. Descargá un respaldo JSON de este dispositivo desde Respaldos antes de volver a cargar la página.');
  }else{document.getElementById('cloudStatus').textContent='Error de sincronización';document.getElementById('headerSync').textContent='No guardado · Reintentar'}
  console.error('Firebase:',e);
 }finally{cloudWriting=false;if(cloudQueued&&!cloudConflict){cloudQueued=false;cloudWrite()}}
}
function cloudSave(){
 if(!cloudReady)return;
 cloudDirty=true;
 cloudVersion++;
 document.getElementById('cloudStatus').textContent='Guardando…';
 document.getElementById('headerSync').textContent='Sincronizando…';
 clearTimeout(cloudTimer);
 cloudTimer=setTimeout(cloudWrite,400);
}
function cloudShowLogin(message='Ingresá a tu cuenta para acceder a tus vehículos y gastos.'){cloudReady=false;cloudGate.hidden=false;cloudImport.hidden=true;cloudLogin.hidden=false;cloudSubtitle.textContent=message;cloudMessage.textContent='';}
function cloudEnter(data){if(!data||!Array.isArray(data.vehicles)||!data.vehicles.length){data=defaultGarage()}state=data;if(!state.vehicles.some(v=>v.id===state.selectedVehicleId))state.selectedVehicleId=state.vehicles[0].id;cloudReady=true;cloudGate.hidden=true;render();cloudWatch();document.getElementById('cloudStatus').textContent='Conectado';document.getElementById('headerSync').textContent='Firebase conectado';document.getElementById('cloudIdentity').textContent=cloudUser?.email||''}
async function cloudLoad(user){if(cloudSnapshot){cloudSnapshot();cloudSnapshot=null}clearTimeout(cloudTimer);cloudDirty=false;cloudQueued=false;cloudVersion=0;cloudRevision=0;cloudConflict=false;cloudReady=false;cloudUser=user;cloudGate.hidden=true;cloudLogin.hidden=true;cloudImport.hidden=true;cloudSubtitle.textContent='Cargando tus vehículos…';try{const doc=await cloudDoc().get();if(doc.exists&&doc.data().state){cloudRevision=Number(doc.data().revision||0);cloudEnter(doc.data().state);return}cloudGate.hidden=false;cloudImport.hidden=false;cloudSubtitle.textContent='Configurá tu garaje';document.getElementById('cloudImportText').textContent='No hay datos en línea en esta cuenta. Si ya usaste Rodme Garage en este navegador, podés importar sus registros existentes. Elegí una opción:'}catch(e){cloudGate.hidden=false;cloudSubtitle.textContent='No se pudieron cargar tus datos';cloudLogin.hidden=false;cloudMessage.textContent=cloudError(e);}}
async function cloudInitial(data){cloudImport.hidden=true;cloudSubtitle.textContent='Creando tu garaje…';try{await cloudDoc().set({state:data,revision:1,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});cloudRevision=1;cloudEnter(data);localStorage.removeItem(KEY)}catch(e){cloudImport.hidden=false;document.getElementById('cloudMessageImport').textContent=cloudError(e)}}
document.getElementById('cloudUseLocal').onclick=()=>cloudInitial(state);
document.getElementById('cloudStartNew').onclick=()=>cloudInitial(defaultGarage());
document.getElementById('cloudForm').addEventListener('submit',async e=>{e.preventDefault();cloudMessage.textContent='Ingresando…';try{await firebase.auth().signInWithEmailAndPassword(document.getElementById('cloudEmail').value.trim(),document.getElementById('cloudPassword').value)}catch(err){cloudMessage.textContent=cloudError(err)}});
document.getElementById('cloudRegister').onclick=async()=>{cloudMessage.textContent='Creando cuenta…';try{await firebase.auth().createUserWithEmailAndPassword(document.getElementById('cloudEmail').value.trim(),document.getElementById('cloudPassword').value)}catch(err){cloudMessage.textContent=cloudError(err)}};
document.getElementById('cloudGoogle').onclick=async()=>{cloudMessage.textContent='Conectando con Google…';try{const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await firebase.auth().signInWithPopup(provider);cloudMessage.textContent=''}catch(err){if(err.code==='auth/popup-blocked'||err.code==='auth/operation-not-supported-in-this-environment'){try{await firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider());return}catch(e){err=e}}cloudMessage.textContent=cloudError(err)}};
async function checkFirebaseConnection(){const status=document.getElementById('cloudTestResult');if(!status)return;status.textContent='Comprobando acceso al servidor…';try{if(!cloudUser||!cloudDb)throw Error('No hay sesión activa');const snap=await cloudDoc().get({source:'server'});status.textContent=snap.exists?'Conexión correcta: Firestore responde y encontré tus registros en línea.':'Conexión correcta, pero todavía no hay un registro de garaje guardado en Firestore.';if(cloudDirty)status.textContent+=' Hay cambios sin confirmar; pulsá Reintentar.'}catch(e){status.textContent='No se pudo consultar Firestore: '+cloudError(e)}}
function retryCloudSave(){if(!cloudReady)return;if(cloudConflict){alert('Primero descargá un respaldo JSON. Existe un conflicto de datos entre dispositivos.');return}clearTimeout(cloudTimer);cloudQueued=false;cloudWrite()}
window.addEventListener('online',()=>{if(cloudReady&&cloudDirty)retryCloudSave()});
async function cloudLogout(){clearTimeout(cloudTimer);if(cloudDirty&&cloudReady)await cloudWrite();if(cloudSnapshot){cloudSnapshot();cloudSnapshot=null}cloudReady=false;cloudUser=null;state=defaultGarage();document.getElementById('headerSync').textContent='Iniciá sesión para sincronizar';document.getElementById('cloudIdentity').textContent='';await firebase.auth().signOut();cloudShowLogin()}
document.getElementById('root').innerHTML='<div style="padding:40px 20px;text-align:center;color:#879298">Preparando tu garaje…</div>';
window.addEventListener('load',()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('PWA',e));try{firebase.initializeApp(firebaseConfig);cloudDb=firebase.firestore();firebase.auth().onAuthStateChanged(user=>user?cloudLoad(user):cloudShowLogin())}catch(e){cloudShowLogin('No se pudo iniciar Firebase. Comprobá tu conexión.');cloudMessage.textContent=cloudError(e)}});
